  zonas:
    activa: true
    antetitulo: Dónde instalamos
    titulo: Lleida y todo el Segrià
    texto: "También en el Pla d'Urgell, la Noguera y les Garrigues. Si tu pueblo no está, pregúntanos."
    titulo_pagina: "Placas solares en {zona}"
    texto_pagina: "En {zona} instalamos placas solares con {negocio}: estudio gratis, trámites y ayudas incluidos."
    imagen: /fotos/zonas.jpg
    items:
      - titulo: Lleida
        texto: "Lleida es el centro de nuestro trabajo y donde más tejados hemos cubierto: casas en barrios y urbanizaciones, adosados y también naves en los polígonos de alrededor. Aquí la luz de la llanura juega a tu favor casi todo el año, y la comunicación al ayuntamiento y la tramitación de las bonificaciones locales las gestionamos nosotros de principio a fin. Si vives en la ciudad o en un pueblo cercano como Alpicat o Torrefarrera, te hacemos el estudio gratis con tu factura y una foto del tejado, y te decimos qué instalación tiene sentido. También instalamos cargadores de coche en garajes de la ciudad y mantenemos placas ya puestas por otros instaladores."
      - titulo: Alcarràs
        texto: "Alcarràs es tierra de fruta, y por eso aquí hacemos sobre todo instalaciones para naves, cámaras frigoríficas y explotaciones agrícolas, donde el consumo coincide con las horas de sol. Una cámara que trabaja de día es un caso casi ideal para el autoconsumo. También instalamos en casas del pueblo y en las fincas de los alrededores, con placas en tejado o en suelo según el espacio. Cubrimos igualmente Seròs, Almacelles y el resto de pueblos de la comarca. Visitamos la nave o la finca, revisamos el suministro y preparamos una propuesta por escrito con la producción prevista y los permisos que hay que pedir."
      - titulo: Torrefarrera
        texto: "Torrefarrera está a un paso de Lleida y combina casas de pueblo con urbanizaciones más recientes. Aquí hacemos autoconsumo en viviendas, baterías y, cada vez más, aerotermia para dejar atrás las calderas de gasóleo y el butano. Una casa antigua del casco puede necesitar revisar radiadores y aislamiento antes de cambiar de sistema, y eso lo miramos contigo en la visita. Si el tejado es adecuado, preparamos las placas y la bomba de calor para que trabajen juntas. Trabajamos también en Alpicat y en la propia ciudad de Lleida, de modo que el servicio de mantenimiento te queda siempre cerca."
      - titulo: Alpicat
        texto: "Alpicat es un pueblo muy próximo a Lleida con muchas casas unifamiliares y adosados, un tipo de vivienda ideal para el autoconsumo. Los tejados suelen tener buena orientación y poca sombra, y eso se nota en la producción. Aquí instalamos placas con o sin batería, cargadores de coche en el garaje y aerotermia para sustituir calderas antiguas. Preparamos todo el papeleo: proyecto, comunicación al ayuntamiento y alta de excedentes. También llegamos a Torrefarrera y a Lleida, así que la revisión anual de las placas y el seguimiento de la producción te lo hace un equipo de la zona."
      - titulo: Almacelles
        texto: "Almacelles tiene muchas granjas y naves agrícolas, y es donde más instalaciones de autoconsumo hacemos para ventilación, iluminación y agua de las explotaciones. Cuando una granja gasta de día, las placas del tejado se notan enseguida en la factura. También ponemos placas en viviendas y adosados del pueblo, aerotermia en casas que aún usan gasóleo y baterías para quien consume por la noche. Llegamos igual a Alguaire, Seròs y Alcarràs. Hacemos una visita sin compromiso, miramos la cubierta y tu factura y te damos por escrito lo que se puede hacer y lo que no compensa."
      - { titulo: Alguaire }
      - titulo: Seròs
        texto: "En Seròs y en las fincas que rodean el pueblo, el riego es lo que más energía pide. Por eso hacemos bombeo solar junto a balsas y pozos, con placas en el suelo conectadas a un variador que arranca la bomba cuando hay sol, y en muchos casos combinado con la red para no depender del tiempo. También instalamos autoconsumo en viviendas, almacenes y granjas de la zona. Trabajamos con frecuencia en los pueblos vecinos de Alcarràs y Almacelles. Nos acercamos a ver el terreno, hablamos con quien lleva la finca y te explicamos qué ayudas del sector agrario puedes consultar en cada convocatoria antes de decidir."
      - { titulo: Mollerussa }
      - { titulo: Balaguer }
      - { titulo: "Bell-lloc d'Urgell" }
      - { titulo: Les Borges Blanques }
      - { titulo: Tàrrega }

