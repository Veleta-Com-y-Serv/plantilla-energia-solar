  preguntas:
    activa: true
    antetitulo: Preguntas frecuentes
    titulo: Lo que nos preguntan antes de poner placas
    preguntas:
      - { pregunta: "¿Cuánto se ahorra con placas solares?", respuesta: "Depende de tu consumo y de a qué hora gastas la luz. En el estudio gratis lo calculamos con tu factura real y te damos el ahorro aproximado por escrito." }
      - { pregunta: "¿Necesito batería?", respuesta: "No siempre. Si gastas mucho de noche, la batería compensa; si gastas sobre todo de día, con la compensación de excedentes suele bastar. Te lo decimos en el estudio." }
      - { pregunta: "¿Hace falta permiso del ayuntamiento?", respuesta: "Sí, normalmente una comunicación o licencia de obra. La pedimos nosotros, junto con el boletín y el alta en la compañía." }
      - { pregunta: "¿Qué pasa los días nublados?", respuesta: "Las placas siguen produciendo, aunque menos. Lo que no cubren las placas lo tomas de la red como siempre: nunca te quedas sin luz." }
      - { pregunta: "¿Cuánto duran las placas?", respuesta: "Las placas tienen una vida útil de décadas y el inversor se revisa en cada mantenimiento. Todo va con garantía por escrito." }
      - { pregunta: "¿Hacéis instalaciones en comunidades de vecinos?", respuesta: "Sí. Preparamos el autoconsumo compartido y explicamos el reparto en la junta de vecinos." }

